<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MechaniX 3D – Automobile Parts Working Principles</title>
<style>
:root{--bg:#0b1020;--panel:#121a30;--line:#24304f;--tx:#e6ecff;--mut:#93a0c4;--ac:#ff7a1a;--ac2:#35b6ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.logo b{color:var(--ac)}.logo span{color:var(--ac2)}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:#1a2442;border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer}
button:hover{border-color:var(--ac2)}
button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
main{flex:1;display:grid;grid-template-columns:1fr 390px;min-height:0}
#stage{position:relative;min-height:340px;background:radial-gradient(circle at 50% 40%,#18234a,#0b1020 70%)}
canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:14px;bottom:10px;color:var(--mut);font-size:12px;pointer-events:none}
#badge{position:absolute;left:14px;top:12px;background:#0b1020cc;border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-weight:600;color:var(--ac2)}
aside{padding:18px;overflow:auto;background:var(--panel);border-left:1px solid var(--line)}
h2{font-size:21px;margin-bottom:6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:16px 0 6px}
p{color:#c4cdea}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
label{color:var(--mut);display:flex;gap:8px;align-items:center;font-size:13px}
input[type=range]{accent-color:var(--ac)}
ol{padding-left:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;padding:8px 10px 8px 38px;position:relative;border-radius:8px;color:#c4cdea;margin-bottom:4px;border:1px solid transparent;font-size:14px}
ol li::before{content:counter(s);position:absolute;left:9px;top:8px;width:20px;height:20px;border-radius:50%;background:#1f2b52;text-align:center;font-size:12px;line-height:20px;color:var(--ac2)}
ol li.on{background:#1b2850;border-color:var(--ac);color:#fff}
ol li.on::before{background:var(--ac);color:#fff}
@media(max-width:820px){body{height:auto;min-height:100vh}main{grid-template-columns:1fr;grid-template-rows:58vh auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="logo">⚙ Mechani<b>X</b> <span>3D</span></div>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="stage"><canvas></canvas><div id="badge"></div><div class="hint">Drag to rotate · Scroll to zoom</div></div>
  <aside>
    <h2 id="t"></h2><p id="d"></p>
    <div id="ctl"></div>
    <h3>Working principle</h3><ol id="steps"></ol>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s), PI=Math.PI, D=PI/180;
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.55,roughness:.4},o));
const glass=(c,o)=>M(c,{transparent:true,opacity:o,metalness:.1,roughness:.2,depthWrite:false,side:THREE.DoubleSide});
const add=(p,geo,mat,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m};
const cylZ=(r,h,s=32)=>{const g=new THREE.CylinderGeometry(r,r,h,s);g.rotateX(PI/2);return g};
const cylX=(r,h,s=32)=>{const g=new THREE.CylinderGeometry(r,r,h,s);g.rotateZ(PI/2);return g};
const box=(x,y,z)=>new THREE.BoxGeometry(x,y,z);
// spur gear with its axis along Z
function gear(r,T,w,col){
  const g=new THREE.Group(),m=M(col);
  add(g,cylZ(r,w,48),m);
  const tg=box(.16,2*PI*r/T*.5,w);
  for(let i=0;i<T;i++){const a=2*PI*i/T,t=add(g,tg,m,Math.cos(a)*(r+.06),Math.sin(a)*(r+.06));t.rotation.z=a}
  add(g,cylZ(.1,w+.02,12),M(0x111111),r*.55,0,0);
  g.userData.mat=m;return g;
}

/* ---------- three.js setup ---------- */
const canvas=$('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const l1=new THREE.DirectionalLight(0xffffff,.9);l1.position.set(5,8,6);scene.add(l1);
const l2=new THREE.DirectionalLight(0x6aa8ff,.45);l2.position.set(-6,2,-5);scene.add(l2);
let th=.6,ph=1.2,rad=12,tgt=new THREE.Vector3();
function resize(){const s=$('#stage');renderer.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('#stage'));
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-drag[0])*.008;ph=Math.min(2.9,Math.max(.2,ph-(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]});
canvas.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(30,Math.max(4,rad*(1+e.deltaY*.001)))},{passive:false});

/* ---------- shared controls ---------- */
let playing=true,speed=1,cur=null,curName='';
function setCtl(extra){
  $('#ctl').innerHTML='<div class="row"><button id="pp">⏸ Pause</button><label>Speed <input id="sp" type="range" min=".1" max="3" step=".1" value="'+speed+'"></label></div>'+extra;
  $('#pp').textContent=playing?'⏸ Pause':'▶ Play';
  $('#pp').onclick=()=>{playing=!playing;$('#pp').textContent=playing?'⏸ Pause':'▶ Play'};
  $('#sp').oninput=e=>speed=+e.target.value;
}
const parts={};

/* ================= 1. ENGINE ================= */
parts.engine=(()=>{
  const g=new THREE.Group(),R=.8,L=2.4,TOP=3.9;let theta=0;
  add(g,new THREE.CylinderGeometry(.78,.78,2.9,40,1,true),glass(0x9db4ff,.2),0,2.45,0);
  add(g,box(2.6,1.7,1.3),glass(0x7788aa,.12),0,.25,0);
  add(g,box(2,.3,1.1),M(0x6b7893),0,4.05,0);
  add(g,cylX(.2,1),M(0x35b6ff,{transparent:true,opacity:.7}),-1.5,4.05,0);
  add(g,cylX(.2,1),M(0xff7a1a,{transparent:true,opacity:.7}),1.5,4.05,0);
  add(g,new THREE.CylinderGeometry(.08,.08,.6,12),M(0xdddddd),0,4.4,0);
  const spark=add(g,new THREE.SphereGeometry(.2,16,12),new THREE.MeshBasicMaterial({color:0xfff2a0}),0,3.8,0);
  // piston + rod
  const P=new THREE.Group();g.add(P);
  add(P,new THREE.CylinderGeometry(.7,.7,.8,40),M(0xb8c0d0));
  [.25,.12].forEach(y=>{const t=add(P,new THREE.TorusGeometry(.7,.03,8,40),M(0x333b4d),0,y,0);t.rotation.x=PI/2});
  add(P,cylZ(.1,1),M(0xd9b34a));
  const rod=add(g,box(.2,L,.12),M(0x8892a6));
  // crank
  const crank=new THREE.Group();g.add(crank);
  add(crank,cylZ(.6,.2,40),M(0x6d7690));
  add(crank,box(.9,.8,.2),M(0x4c556d),0,-.5,0);
  add(crank,cylZ(.14,.5),M(0xff4a4a),0,R,0);
  add(crank,cylZ(1.15,.12,48),M(0x3a4258),0,0,-.55);
  add(crank,cylZ(.1,.14,12),M(0xff4a4a),0,.9,-.55);
  add(g,cylZ(.15,2.4),M(0x9aa3b5));
  // valves + cams
  const mkV=x=>{const v=new THREE.Group();v.position.x=x;g.add(v);add(v,new THREE.CylinderGeometry(.22,.22,.06,24),M(0xd0d6e2));add(v,new THREE.CylinderGeometry(.05,.05,1,10),M(0xd0d6e2),0,.5,0);return v};
  const vI=mkV(-.4),vE=mkV(.4);
  const mkC=(x,c)=>{const k=new THREE.Group();k.position.set(x,5.06,0);g.add(k);add(k,cylZ(.07,1.4,10),M(0x9aa3b5));add(k,cylZ(.18,.3,24),M(c));add(k,box(.12,.2,.3),M(c),0,-.27,0);return k};
  const cI=mkC(-.4,0x35b6ff),cE=mkC(.4,0xff7a1a);
  // gas
  const gm=new THREE.MeshBasicMaterial({color:0x4fc3ff,transparent:true,opacity:.35,depthWrite:false});
  const gas=add(g,new THREE.CylinderGeometry(.68,.68,1,24),gm);
  const cols=[0x4fc3ff,0xffc14a,0xff4a1a,0x8a8f9e].map(c=>new THREE.Color(c)),ops=[.35,.5,.8,.4],names=['Intake','Compression','Power','Exhaust'];
  const lobe=(th,pk)=>{let x=((th-pk)%720+720)%720,a=x/2;if(a>180)a-=360;return[a,Math.max(0,(Math.cos(a*D)-.707)/.293)]};
  return{group:g,cam:{rad:13,th:.45,ph:1.25,t:[0,1.7,0]},
    title:'Four-Stroke Petrol Engine',
    desc:'An internal-combustion engine turns the heat of burning fuel into rotation. Each cylinder repeats a four-stroke cycle: it takes two full turns of the crankshaft (720°), while the camshaft turns once at half the crank speed.',
    steps:['<b>Intake</b> – the piston moves down, the intake valve (blue) opens and the air-fuel mix is sucked in.','<b>Compression</b> – both valves close and the rising piston squeezes the mixture, making it hot and dense.','<b>Power</b> – the spark plug ignites the mixture; expanding gas drives the piston down and spins the crankshaft.','<b>Exhaust</b> – the exhaust valve (orange) opens and the rising piston pushes burnt gas out.'],
    ui:'<div class="row" id="jump">'+names.map((n,i)=>'<button data-i="'+i+'">'+n+'</button>').join('')+'</div>',
    bind(){document.querySelectorAll('#jump button').forEach(b=>b.onclick=()=>theta=b.dataset.i*180+2)},
    update(dt,s){
      theta=(theta+dt*120*s)%720;
      const t=theta*D,py=R*Math.cos(t)+Math.sqrt(L*L-R*R*Math.sin(t)**2);
      P.position.y=py;
      const cp=new THREE.Vector3(R*Math.sin(t),R*Math.cos(t),0),d=new THREE.Vector3(0,py,0).sub(cp);
      rod.position.copy(cp).addScaledVector(d,.5);rod.rotation.z=-Math.atan2(d.x,d.y);
      crank.rotation.z=-t;
      const[ai,li]=lobe(theta,90),[ae,le]=lobe(theta,630);
      cI.rotation.z=ai*D;cE.rotation.z=ae*D;vI.position.y=3.88-li*.22;vE.position.y=3.88-le*.22;
      const p=Math.floor(theta/180),h=Math.max(TOP-(py+.4),.02);
      gas.scale.y=h;gas.position.y=py+.4+h/2;
      gm.color.lerp(cols[p],.12);gm.opacity+=(ops[p]-gm.opacity)*.12;
      spark.visible=theta>=355&&theta<385;
      document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===p));
      return names[p]+' stroke · crank '+Math.round(theta)+'°';
    }};
})();

/* ================= 2. GEARBOX ================= */
parts.gearbox=(()=>{
  const g=new THREE.Group(),Y=1.2,Dc=2.4,Tin=16,Tcd=22,Tc=[10,14,19,24],Tm=[29,24,19,14],Z=[-1.5,-.5,.5,1.5];
  let a=0,sel=1;
  add(g,box(4.4,6.4,7.4),glass(0x7788aa,.08),0,.15,-.2);
  const sh=(y,z0,z1)=>add(g,cylZ(.16,z1-z0),M(0x9aa3b5),0,y,(z0+z1)/2);
  const inS=sh(Y,-3.9,-2.6),mainS=sh(Y,-1.9,2.5),cntS=sh(-Y,-3.5,2.1);
  [inS,mainS,cntS].forEach(s=>add(s,box(.1,.1,.6),M(0xff4a4a),.16,0,0));
  const mk=(r,T,y,z,col,up)=>{const gr=gear(r,T,.45,col);gr.position.set(0,y,z);g.add(gr);return{gr,base:up?-PI/2+PI/T:PI/2}};
  const rin=Tin/(Tin+Tcd)*Dc,rcd=Tcd/(Tin+Tcd)*Dc;
  const gIn=mk(rin,Tin,Y,-3,0x35b6ff,true),gCd=mk(rcd,Tcd,-Y,-3,0x35b6ff,false);
  const gM=[],gC=[];
  for(let i=0;i<4;i++){const rm=Tm[i]/(Tm[i]+Tc[i])*Dc,rc=Tc[i]/(Tm[i]+Tc[i])*Dc;
    gM.push(mk(rm,Tm[i],Y,Z[i],0xff9a3c,true));gC.push(mk(rc,Tc[i],-Y,Z[i],0x8fa0c8,false))}
  const collar=add(g,new THREE.TorusGeometry(.36,.09,12,28),M(0xffd24a,{emissive:0x664400}),0,Y,Z[0]+.4);
  const names=['Neutral','1st','2nd','3rd','4th'];
  const ratio=i=>Tcd/Tin*Tm[i-1]/Tc[i-1];
  const setSel=i=>{sel=i;document.querySelectorAll('#gsel button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i))};
  return{group:g,cam:{rad:15,th:.9,ph:1.2,t:[0,0,-.4]},
    title:'Manual Gearbox (Transmission)',
    desc:'A gearbox lets the engine run in its efficient speed range while the wheels turn at very different speeds. It trades speed for torque by meshing gear pairs with different tooth counts.',
    steps:['<b>Input shaft</b> (blue, top-left) receives engine power through the clutch.','<b>Constant mesh</b> – the input gear always drives the countershaft (bottom), which spins every lower gear.','<b>Free gears</b> – the orange gears on the output shaft spin freely at different speeds, each meshed with its countershaft partner.','<b>Selector collar</b> (gold ring) locks one chosen gear to the output shaft; the others keep idling.','<b>Ratio</b> – ratio = driven teeth ÷ driving teeth. 1st: big ratio = high torque, low speed. 4th: low ratio = high speed.'],
    ui:'<div class="row" id="gsel">'+names.map((n,i)=>'<button data-i="'+i+'">'+(i?n:'N')+'</button>').join('')+'</div>',
    bind(){document.querySelectorAll('#gsel button').forEach(b=>b.onclick=()=>setSel(+b.dataset.i));setSel(sel)},
    update(dt,s){
      a+=dt*2*s;
      gIn.gr.rotation.z=gIn.base+a;
      const pc=-a*Tin/Tcd;gCd.gr.rotation.z=gCd.base+pc;cntS.rotation.z=pc;inS.rotation.z=a;
      for(let i=0;i<4;i++){
        gC[i].gr.rotation.z=gC[i].base+pc;
        const pm=-pc*Tc[i]/Tm[i];gM[i].gr.rotation.z=gM[i].base+pm;
        gM[i].gr.userData.mat.emissive.setHex(sel===i+1?0x773300:0);
        if(sel===i+1)mainS.rotation.z=pm;
      }
      if(!sel)mainS.rotation.z=0;
      const tz=sel?Z[sel-1]+.4:(Z[1]+Z[2])/2;collar.position.z+=(tz-collar.position.z)*.2;
      collar.material.emissive.setHex(sel?0x664400:0x221100);
      return sel?names[sel]+' gear · ratio '+ratio(sel).toFixed(2)+' : 1':'Neutral · output shaft not driven';
    }};
})();

/* ================= 3. DIFFERENTIAL ================= */
parts.diff=(()=>{
  const g=new THREE.Group(),Tr=40,Tp=11;let ac=0,pin=0,k=0,aL=0,aR=0,aS=0;
  const car=new THREE.Group();g.add(car);
  const rw=new THREE.Group();rw.rotation.y=PI/2;rw.position.x=.4;car.add(rw);
  const ring=gear(2,Tr,.3,0xc9a85a);rw.add(ring);
  add(car,new THREE.SphereGeometry(1.2,28,18),glass(0x9db4ff,.15));
  add(car,cylZ(.07,1.6),M(0xdddddd));
  const sp=[.65,-.65].map(z=>{const h=new THREE.Group();h.position.z=z;car.add(h);const w=new THREE.Group();h.add(w);
    w.add(new THREE.Mesh(new THREE.CylinderGeometry(.12,.3,.45,20),M(0xff9a3c)));add(w,box(.08,.45,.08),M(0xff3333),.2,0,0);
    h.rotation.x=z>0?PI/2:-PI/2;return w});
  const ax=(sgn,col)=>{const A=new THREE.Group();g.add(A);
    add(A,cylX(.12,2.6),M(0x9aa3b5),sgn*1.8,0,0);
    const sd=add(A,new THREE.CylinderGeometry(.55,.25,.5,24),M(col),sgn*.62,0,0);sd.rotation.z=-sgn*PI/2;add(A,box(.5,.1,.1),M(0xff3333),sgn*.62,.4,0);
    add(A,cylX(1.15,.6,40),M(0x1c1f2b),sgn*3.3,0,0);add(A,cylX(.75,.64,32),M(0xc3cadb),sgn*3.3,0,0);
    add(A,box(.66,1.5,.14),M(0xff7a1a),sgn*3.3,0,0);return A};
  const AL=ax(-1,0x35b6ff),AR=ax(1,0x35b6ff);
  const pn=new THREE.Group();pn.position.set(.4,0,2.55);g.add(pn);
  add(pn,new THREE.CylinderGeometry(.18,.5,1.2,24),M(0xd9b34a)).rotation.x=PI/2;
  add(pn,cylZ(.14,3),M(0x9aa3b5),0,0,1.8);add(pn,box(.12,.12,.5),M(0xff3333),.14,0,2.2);
  g.position.y=-.6;
  return{group:g,cam:{rad:14,th:.9,ph:1.15,t:[0,0,0]},
    title:'Differential',
    desc:'When a car turns, the outer wheel travels farther than the inner one, so the wheels must spin at different speeds. The differential splits engine torque between them while allowing that speed difference.',
    steps:['<b>Driveshaft pinion</b> (gold) turns the large ring gear, which carries the whole cage (carrier).','<b>Carrier</b> rotates with the ring gear and carries the cross-pin with two small spider gears.','<b>Straight line</b> – spider gears do not spin on their pin; they push both side gears equally, so both wheels turn at the same speed.','<b>Cornering</b> – the inner wheel resists, so the spider gears start to spin on their pin: they slow one side gear and speed up the other by the same amount.','The <b>average</b> of the two wheel speeds always equals the carrier speed.'],
    ui:'<div class="row"><label>Steer ◀ Left <input id="steer" type="range" min="-.8" max=".8" step=".05" value="0"> Right ▶</label></div>',
    bind(){$('#steer').value=k;$('#steer').oninput=e=>k=+e.target.value},
    update(dt,s){
      const w=1.2*s;ac+=dt*w;aL+=dt*w*(1+k);aR+=dt*w*(1-k);aS+=dt*w*k*3;pin+=dt*w*Tr/Tp;
      car.rotation.x=ac;AL.rotation.x=aL;AR.rotation.x=aR;pn.rotation.z=pin;
      sp.forEach(w=>w.rotation.y=aS);
      const m=Math.abs(k)<.04?'Driving straight':(k<0?'Turning left':'Turning right');
      return m+' · left wheel '+Math.round((1+k)*100)+'% · right wheel '+Math.round((1-k)*100)+'%';
    }};
})();

/* ================= 4. DISC BRAKE ================= */
parts.brake=(()=>{
  const g=new THREE.Group(),rot=new THREE.Group();g.add(rot);
  let pedal=0,pp=0,heat=0,ang=0;
  const dm=M(0x9aa3b5,{metalness:.8,emissive:0x000000});
  add(rot,cylZ(2,.2,64),dm);add(rot,cylZ(.85,.5,40),M(0x555e73));
  for(let i=0;i<14;i++){const a=2*PI*i/14;add(rot,cylZ(.12,.24,12),M(0x0b1020),Math.cos(a)*1.4,Math.sin(a)*1.4,0)}
  for(let i=0;i<5;i++){const a=2*PI*i/5;add(rot,cylZ(.08,.75,8),M(0xeeeeee),Math.cos(a)*.55,Math.sin(a)*.55,0)}
  add(rot,box(.15,.3,.3),M(0xff3333),1.8,0,.12);
  const cal=new THREE.Group();cal.position.x=1.45;g.add(cal);
  const cm=M(0xd32f2f,{metalness:.4});
  add(cal,box(.9,1,.18),cm,0,0,.66);add(cal,box(.9,1,.18),cm,0,0,-.66);add(cal,box(.9,.16,1.5),cm,0,.55,0);
  const pm=M(0x4a3b2a,{emissive:0x000000}),pads=[1,-1].map(s=>add(cal,box(.6,.9,.14),pm));
  const pis=[1,-1].map(s=>add(cal,cylZ(.26,.25,24),M(0xcfd5e3)));
  add(g,cylX(.07,2.2),M(0xe8a33d),3.2,.55,0);
  return{group:g,cam:{rad:9.5,th:.75,ph:1.3,t:[0,0,0]},
    title:'Hydraulic Disc Brake',
    desc:'A brake converts the car’s kinetic energy into heat by friction. Hydraulics multiply the force of your foot and send it equally to every wheel.',
    steps:['<b>Pedal</b> pushes a piston in the master cylinder, pressurising the brake fluid.','<b>Hydraulic line</b> (gold) carries the pressure to the caliper – fluid cannot be compressed (Pascal’s law).','<b>Caliper pistons</b> push the two brake pads inward against the spinning disc (rotor).','<b>Friction</b> between pads and disc slows the wheel and turns motion energy into heat (watch the disc glow).','<b>Release</b> – when pressure drops, seals retract the pistons and the pads move away.'],
    ui:'<div class="row"><label>Brake pedal <input id="pedal" type="range" min="0" max="1" step=".02" value="0"></label></div>',
    bind(){$('#pedal').value=pedal;$('#pedal').oninput=e=>pedal=+e.target.value},
    update(dt,s){
      pp+=(pedal-pp)*.15;
      const gap=.3*(1-pp);
      pads.forEach((p,i)=>p.position.z=(i?-1:1)*(.17+gap));
      pis.forEach((p,i)=>p.position.z=(i?-1:1)*(.17+gap+.19));
      const w=3*s*(1-pp);ang-=dt*w;rot.rotation.z=ang;
      heat=Math.min(1,Math.max(0,heat+dt*(pp*3*s*.35-.25*heat)));
      dm.emissive.setRGB(1,.22,0).multiplyScalar(heat*.9);pm.emissive.setRGB(1,.3,0).multiplyScalar(heat*.6);
      return'Pedal '+Math.round(pp*100)+'% · wheel speed '+Math.round((1-pp)*100)+'%';
    }};
})();

/* ---------- tabs & loop ---------- */
const labels={engine:'Engine',gearbox:'Gearbox',diff:'Differential',brake:'Disc Brake'};
function show(n){
  if(cur)scene.remove(cur.group);
  cur=parts[n];curName=n;scene.add(cur.group);
  th=cur.cam.th;ph=cur.cam.ph;rad=cur.cam.rad;tgt.set(...cur.cam.t);
  $('#t').textContent=cur.title;$('#d').textContent=cur.desc;
  $('#steps').innerHTML=cur.steps.map(s=>'<li>'+s+'</li>').join('');
  setCtl(cur.ui);cur.bind();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.n===n));
}
$('#tabs').innerHTML=Object.keys(labels).map(k=>'<button data-n="'+k+'">'+labels[k]+'</button>').join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.n));
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  $('#badge').textContent=cur.update(playing?dt:0,speed);
  cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));
  cam.lookAt(tgt);renderer.render(scene,cam);requestAnimationFrame(loop);
}
show('engine');resize();requestAnimationFrame(loop);
</script>
</body>
